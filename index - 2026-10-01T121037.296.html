<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Facture — TVA et calculs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1118; --bg2:#151923; --bg3:#1d2230; --card:#181c28;
  --accent:#22d68a; --orange:#ff8a3d; --gold:#ffc93c;
  --text:#eef1f7; --text2:#a7aec0; --text3:#6c7488;
  --border:#2a3042; --radius:16px; --success:#22d68a; --error:#ff4d6a;
  --paper:#fbf8f0; --ink:#1f2633; --ink2:#5b6475; --rule:#ddd5c2;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55;
  background-image:radial-gradient(circle at 12% -5%,rgba(34,214,138,.09),transparent 42%),radial-gradient(circle at 95% 5%,rgba(255,138,61,.07),transparent 38%);background-attachment:fixed}
button,select,input{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
b,strong{font-weight:700}

/* ===== HUD ===== */
.hud{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(14,17,24,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;letter-spacing:.2px}
.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,var(--accent),#119a5f);font-size:1.15rem;box-shadow:0 0 18px rgba(34,214,138,.35)}
.hud-right{display:flex;align-items:center;gap:7px}
.pill{font-family:var(--mono);font-size:.8rem;padding:5px 10px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);white-space:nowrap}
.pill.hot{border-color:var(--orange);color:var(--orange)}
.pill.pulse{animation:pulse .7s ease}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:1rem;display:grid;place-items:center}
#globalTimer{font-family:var(--mono);font-size:.8rem;color:var(--text2);display:none}
.xpwrap{max-width:980px;margin:0 auto;padding:12px 16px 0}
.xprow{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--text2);margin-bottom:6px}
.xprow b{color:var(--text)}
.xpbar{position:relative;height:12px;border-radius:999px;background:var(--bg3);border:1px solid var(--border)}
#xpFill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--gold));width:0;transition:width .7s ease}
.xpmark{position:absolute;top:-4px;width:2px;height:18px;background:var(--text3);border-radius:2px}
.xpmark.next{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.navdots{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.navdot{min-width:36px;height:28px;padding:0 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-weight:700;font-size:.8rem}
.navdot.done{background:rgba(34,214,138,.14);border-color:var(--accent);color:var(--accent)}
.navdot.current{border-color:var(--gold);color:var(--gold)}
.navdot.locked{opacity:.4;cursor:not-allowed}

main{max-width:980px;margin:0 auto;padding:20px 16px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
.btn{border:none;border-radius:12px;padding:12px 20px;font-weight:700;font-size:1rem;background:var(--accent);color:#08170f;transition:transform .15s ease,opacity .2s ease,background .2s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.orange{background:var(--orange);color:#1f0f03}
.btn.gold{background:var(--gold);color:#241a00}
.btn.lb-app{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn.lb-glob{background:transparent;border:1px solid var(--orange);color:var(--orange)}
.btn.lb-app:hover{background:var(--accent);color:#08170f}
.btn.lb-glob:hover{background:var(--orange);color:#1f0f03}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.row.between{justify-content:space-between}
.muted{color:var(--text2)}
.small{font-size:.85rem}
h1,h2,h3{line-height:1.2}

/* ===== Accueil ===== */
.welcome{display:grid;grid-template-columns:240px 1fr;gap:34px;align-items:center;padding:20px 0}
.receipt{width:100%;max-width:240px;transform:rotate(-4deg);filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.welcome h1{font-size:2.6rem;font-weight:800;letter-spacing:-.5px}
.welcome .lead{font-size:1.15rem;color:var(--text2);margin:8px 0 18px;max-width:52ch}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:1.25rem;font-family:var(--mono)}
.stat span{font-size:.78rem;color:var(--text2)}
.who{font-size:.88rem;color:var(--text2);margin-bottom:16px}
.who b{color:var(--accent)}

/* ===== Parcours ===== */
.final-banner{margin-bottom:22px}
.path{position:relative;display:flex;flex-direction:column;gap:18px;margin:12px 0 30px}
.path::before{content:'';position:absolute;left:50%;top:14px;bottom:14px;border-left:3px dashed var(--border);transform:translateX(-50%)}
.prow{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:14px}
.prow .node{grid-column:2;grid-row:1;justify-self:center}
.prow.left .pcard{grid-column:1;grid-row:1}
.prow.right .pcard{grid-column:3;grid-row:1}
.node{position:relative;z-index:1;width:54px;height:54px;border-radius:50%;border:3px solid var(--border);background:var(--bg2);color:var(--text);font-weight:800;font-size:1.1rem}
.node.done{background:var(--accent);border-color:var(--accent);color:#08170f}
.node.todo{border-color:var(--gold);color:var(--gold);animation:glow 1.8s ease-in-out infinite}
.node.locked,.pcard.locked{opacity:.45;cursor:not-allowed}
.pcard{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;color:var(--text);width:100%}
.pcard:hover:not(.locked){border-color:var(--accent)}
.pcard .ic{font-size:1.5rem}
.pcard h3{font-size:1.02rem;margin:4px 0 2px}
.pcard p{font-size:.85rem;color:var(--text2)}
.pcard .meta{margin-top:8px;font-size:.8rem;color:var(--text2);font-family:var(--mono)}
.stars{color:var(--gold);letter-spacing:2px}
.section-title{font-size:1.15rem;margin:8px 0 12px}
.trophies{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.trophy{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}
.trophy .ti{font-size:1.8rem}
.trophy b{display:block;font-size:.88rem;margin-top:4px}
.trophy span{font-size:.75rem;color:var(--text2)}
.trophy.off{opacity:.45;filter:grayscale(1)}
.trophy.on{border-color:var(--gold);box-shadow:0 0 16px rgba(255,201,60,.18)}

/* ===== Briefing ===== */
.brief{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.brief-head{display:flex;gap:16px;align-items:center}
.brief-head .big{font-size:2.6rem;width:74px;height:74px;display:grid;place-items:center;border-radius:18px;background:var(--bg3);border:1px solid var(--border)}
.brief-head h2{font-size:1.5rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip-info{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.goals{border-left:4px solid var(--accent)}
.goals h3{font-size:1rem;margin-bottom:6px}
.goals ul{padding-left:20px}
.goals li{margin:3px 0}
.theory p{margin-bottom:10px}
.theory .fig{display:flex;gap:18px;align-items:center;margin:10px 0 14px;flex-wrap:wrap}
.theory .fig svg{flex:0 0 auto}
.theory .fig .cap{flex:1;min-width:180px;color:var(--text2);font-size:.92rem}
.steps{counter-reset:st;list-style:none;margin:6px 0 12px}
.steps li{counter-increment:st;position:relative;padding:8px 10px 8px 46px;margin:6px 0;background:var(--bg2);border:1px solid var(--border);border-radius:12px}
.steps li::before{content:counter(st);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--accent);color:#08170f;font-weight:800;display:grid;place-items:center;font-size:.85rem}
.rates{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:.93rem}
.rates td{padding:8px 10px;border-bottom:1px solid var(--border)}
.rates td:first-child{font-family:var(--mono);font-weight:700;color:var(--gold);width:70px}
.tips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tip-chip{padding:6px 12px;border-radius:10px;background:rgba(255,201,60,.08);border:1px solid rgba(255,201,60,.35);font-size:.9rem}
.example{background:rgba(255,138,61,.08);border:1px solid rgba(255,138,61,.45);border-radius:var(--radius);padding:16px 18px}
.example h3{color:var(--orange);font-size:.98rem;margin-bottom:6px}
.example .calcline{font-family:var(--mono);font-size:.88rem;margin:3px 0}
.plus{background:rgba(255,201,60,.07);border:1px dashed rgba(255,201,60,.55);border-radius:var(--radius);padding:14px 18px;font-size:.92rem}
.plus h3{color:var(--gold);font-size:.95rem;margin-bottom:4px}
.predict h3{font-size:1rem;margin-bottom:10px}
.predict .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pred-btn{padding:12px 8px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-weight:600}
.pred-btn.on{border-color:var(--gold);background:rgba(255,201,60,.12);color:var(--gold)}

/* ===== Questions ===== */
.qwrap{max-width:820px;margin:0 auto}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qtop .where{font-size:.88rem;color:var(--text2)}
.qdots{display:flex;gap:6px}
.qdot{width:14px;height:14px;border-radius:50%;background:var(--bg3);border:1px solid var(--border)}
.qdot.correct{background:var(--success);border-color:var(--success)}
.qdot.hint{background:var(--orange);border-color:var(--orange)}
.qdot.shown{background:var(--error);border-color:var(--error)}
.qdot.cur{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.qmeta{font-family:var(--mono);font-size:.78rem;color:var(--text3);margin-bottom:8px}
.qtext{font-size:1.2rem;font-weight:600;margin-bottom:12px}
.data{display:block;background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.98rem}
.data b{font-family:var(--mono);color:var(--gold)}
.opts-list{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:1rem;transition:border-color .2s,background .2s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .box{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--text3);display:grid;place-items:center;font-size:.8rem}
.opt.sel{border-color:var(--gold);background:rgba(255,201,60,.08)}
.opt.sel .box{border-color:var(--gold);background:var(--gold);color:#241a00}
.opt.good{border-color:var(--success);background:rgba(34,214,138,.12)}
.opt.bad{border-color:var(--error);background:rgba(255,77,106,.1)}
.opt.missed{border:2px dashed var(--success)}
.opt:disabled{cursor:default}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .opt{justify-content:center;font-weight:700;font-size:1.1rem;padding:18px}
.calc .inrow{display:flex;align-items:center;gap:8px;max-width:420px}
.calc input,.cell-in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:1.15rem;font-family:var(--mono)}
.calc input:focus,.cell-in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(34,214,138,.2)}
.calc .unit{font-family:var(--mono);font-size:1.15rem;color:var(--text2)}
.preview{min-height:1.5em;margin-top:8px;font-family:var(--mono);font-size:.9rem;color:var(--accent)}
.helper{font-size:.82rem;color:var(--text3);margin-top:2px}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;min-height:58px;border-radius:12px;background:var(--bg2);border:1px dashed var(--border);margin-bottom:14px}
.bank:empty::after{content:'Toutes les étiquettes sont placées.';color:var(--text3);font-size:.85rem;align-self:center}
.chip{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:.92rem;text-align:left}
.chip.sel{border-color:var(--gold);background:rgba(255,201,60,.14);box-shadow:0 0 0 2px rgba(255,201,60,.3)}
.chip.g{border-color:var(--success);background:rgba(34,214,138,.13);cursor:default}
.chip.o{border-color:var(--orange);background:rgba(255,138,61,.13);cursor:default}
.chip.r{border-color:var(--error);background:rgba(255,77,106,.11);cursor:default}
.chip .corr{display:block;font-size:.78rem;color:var(--error);margin-top:2px}
.chip.bounce{animation:bounce .5s ease}
.zones{display:grid;grid-template-columns:repeat(var(--nz,3),1fr);gap:10px}
.zone{min-height:140px;border-radius:14px;border:2px dashed var(--border);background:rgba(255,255,255,.02);padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--text)}
.zone.armed{border-color:var(--gold);background:rgba(255,201,60,.05)}
.zone .zh{font-weight:800;font-size:.95rem;text-align:center;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:4px}
.match-row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.match-row .term{font-weight:700;padding:10px 12px;border-radius:10px;background:var(--bg3);border:1px solid var(--border)}
.match-row select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:.95rem}
.match-row.g select{border-color:var(--success)}
.match-row.o select{border-color:var(--orange)}
.match-row.r select{border-color:var(--error)}
.match-row .corr{grid-column:2;font-size:.82rem;color:var(--error);margin-top:-4px}
.slots{list-style:none;display:grid;gap:8px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:12px;border:2px dashed var(--border);background:rgba(255,255,255,.02);color:var(--text);min-height:50px}
.slot .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-weight:800;font-family:var(--mono);font-size:.85rem}
.slot.filled{border-style:solid}
.slot.armed{border-color:var(--gold)}
.slot.g{border:2px solid var(--success);background:rgba(34,214,138,.1);cursor:default}
.slot.o{border:2px solid var(--orange);background:rgba(255,138,61,.1);cursor:default}
.slot.r{border:2px solid var(--error);background:rgba(255,77,106,.08);cursor:default}
.slot .ph{color:var(--text3);font-size:.88rem}
.slot .corr{display:block;font-size:.8rem;color:var(--error)}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:.96rem;border:1px solid}
.fb.ok{background:rgba(34,214,138,.09);border-color:rgba(34,214,138,.5)}
.fb.h2,.fb.hint{background:rgba(255,138,61,.09);border-color:rgba(255,138,61,.5)}
.fb.shown{background:rgba(255,77,106,.08);border-color:rgba(255,77,106,.5)}
.fb.info{background:var(--bg2);border-color:var(--border)}
.fb .fbh{font-weight:800;margin-bottom:4px}
.fb .stepline{display:block;font-family:var(--mono);font-size:.86rem;margin:3px 0}
.qactions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.shake{animation:shake .45s ease}

/* ===== Papier : facture et bilans ===== */
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:22px;box-shadow:0 14px 34px rgba(0,0,0,.4);font-size:.92rem}
.paper .inv-head{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px;flex-wrap:wrap}
.paper .inv-title{text-align:right;font-weight:800;font-size:1.4rem;letter-spacing:1px}
.paper .inv-title span{display:block;font-size:.8rem;font-weight:500;letter-spacing:0;color:var(--ink2)}
.paper .inv-client{margin-bottom:12px;color:var(--ink2);font-size:.86rem}
.paper .inv-client b{color:var(--ink)}
.inv-table,.inv-sum{width:100%;border-collapse:collapse}
.inv-table th{text-align:left;font-size:.75rem;color:var(--ink2);border-bottom:1px solid var(--rule);padding:6px 6px}
.inv-table td{padding:7px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
.inv-table td.r,.inv-table th.r,.inv-sum td.r{text-align:right;font-family:var(--mono);white-space:nowrap}
.inv-sum{margin-top:12px}
.inv-sum td{padding:6px 6px;border-bottom:1px dotted var(--rule)}
.inv-sum tr.strong td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none;font-size:1.02rem}
.inv-sum .op{color:var(--ink2);font-family:var(--mono);width:22px}
.inv-sum small,.inv-table small{color:var(--ink2);font-size:.72rem}
.paper .cell-in{width:128px;padding:6px 8px;font-size:.95rem;background:#fff;color:var(--ink);border:1.5px dashed #9aa3b2;border-radius:6px;text-align:right}
.paper .cell-in:focus{border-style:solid;border-color:#119a5f;box-shadow:0 0 0 3px rgba(17,154,95,.18)}
.cellv{display:inline-block;min-width:110px;padding:5px 8px;border-radius:6px;font-family:var(--mono);text-align:right}
.cellv.g{background:#d9f6e8;color:#0d6b42}
.cellv.o{background:#ffe8d6;color:#99470f}
.cellv.r{background:#ffe0e5;color:#a3122d}
.inv-prev{min-height:1.4em;margin-top:10px;font-family:var(--mono);font-size:.82rem;color:#119a5f}
.paper .sign{margin-top:14px;font-size:.8rem;color:var(--ink2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.paper h3{font-size:1.1rem;margin-bottom:6px}
.crit{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin-top:12px}
.crit-h{display:flex;justify-content:space-between;gap:10px;font-weight:800;flex-wrap:wrap}
.ind{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:.9rem;flex-wrap:wrap}
.tag{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.atteint{background:#d9f6e8;color:#0d6b42}
.tag.encours{background:#ffe8d6;color:#99470f}
.tag.nonatteint{background:#ffe0e5;color:#a3122d}
.revoir{font-size:.86rem;color:var(--ink2);margin:2px 0 4px;width:100%}

/* ===== Bilans ===== */
.bilan{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.bilan-top{text-align:center}
.medal{font-size:3.6rem;line-height:1}
.grade{display:inline-block;margin-top:8px;font-weight:800;font-size:1.05rem;padding:6px 14px;border-radius:999px;border:1px solid var(--gold);color:var(--gold)}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--text2);margin:10px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:center}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:.78rem;color:var(--text2)}
.pred-note{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.93rem}

/* ===== Effets ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:9000;overflow:hidden}
.part{position:absolute;width:8px;height:8px;border-radius:50%;animation:part .8s ease-out forwards}
.floatxp{position:absolute;font-family:var(--mono);font-weight:700;color:var(--gold);font-size:1.15rem;text-shadow:0 0 10px rgba(255,201,60,.6);animation:floatup 1.1s ease-out forwards}
.combo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-weight:800;font-size:2.2rem;color:var(--orange);text-shadow:0 0 22px rgba(255,138,61,.7);animation:combo 1s ease-out forwards;white-space:nowrap}
.confetti{position:absolute;top:-12px;width:9px;height:14px;animation:fall linear forwards}
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9500;pointer-events:none}
.toast{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--gold);border-radius:14px;padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastin .35s ease}
.toast .ti{font-size:1.8rem}
.toast small{display:block;color:var(--gold);font-size:.75rem;font-weight:700}
.overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:440px;box-shadow:0 0 40px rgba(0,0,0,.5);animation:slideup .35s ease}
.modal.wide{max-width:620px;max-height:85vh;overflow-y:auto}
.close-x{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--text2);font-size:1.5rem}
.rays{position:absolute;width:900px;height:900px;background:repeating-conic-gradient(rgba(255,201,60,.12) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 14s linear infinite}
.rank-card{position:relative;text-align:center;background:var(--bg2);border:2px solid var(--gold);border-radius:20px;padding:30px 34px;animation:pop .6s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 50px rgba(255,201,60,.3)}
.rank-card .ri{font-size:4rem}
.rank-card h2{color:var(--gold);margin:6px 0}
#emailInput{width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:1rem;margin-bottom:12px}
#emailError{color:var(--error);font-size:.82rem;margin-bottom:12px;min-height:1.2em}

@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,201,60,.5)}50%{box-shadow:0 0 0 9px rgba(255,201,60,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes bounce{0%{transform:translateY(-14px);opacity:.3}60%{transform:translateY(3px);opacity:1}100%{transform:translateY(0)}}
@keyframes part{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes floatup{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
@keyframes combo{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes toastin{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

@media (max-width:768px){
  .welcome{grid-template-columns:1fr;text-align:center;gap:14px}
  .receipt{max-width:170px;margin:0 auto}
  .welcome .lead{margin-left:auto;margin-right:auto}
  .stats{grid-template-columns:repeat(3,1fr)}
  .welcome .row{justify-content:center}
  .trophies{grid-template-columns:repeat(2,1fr)}
  .zones{grid-template-columns:1fr}
  .zone{min-height:80px}
  .match-row{grid-template-columns:1fr}
  .match-row .corr{grid-column:1}
}
@media (max-width:480px){
  .app-title{display:none}
  .pill{font-size:.72rem;padding:4px 7px}
  .icon-btn{width:32px;height:32px}
  .hud{padding:8px 10px}
  main{padding:14px 10px 90px}
  .card{padding:16px}
  .welcome h1{font-size:2rem}
  .stats{grid-template-columns:repeat(2,1fr)}
  .path::before{left:27px;transform:none}
  .prow{grid-template-columns:54px 1fr}
  .prow .node{grid-column:1}
  .prow.left .pcard,.prow.right .pcard{grid-column:2}
  .predict .opts{grid-template-columns:1fr}
  .vf{grid-template-columns:1fr}
  .paper{padding:14px}
  .paper{font-size:.86rem}
  .inv-table td,.inv-table th{padding:6px 3px}
  .inv-table th.r{white-space:normal}
  .inv-table td.r small{white-space:normal;display:block}
  .paper .cell-in{width:92px;font-size:.88rem;padding:6px}
  .cellv{min-width:0}
  .brief-head .big{width:58px;height:58px;font-size:2rem}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .fiche,.fiche *{visibility:visible}
  .fiche{position:absolute;left:0;top:0;width:100%;box-shadow:none}
  .no-print{display:none !important}
}

<script>
'use strict';
/* =========================================================
   UTILITAIRES
   ========================================================= */
function evalExpr(s){
  let e = String(s).replace(/\s|\u00a0|\u202f|€|%/g,'').replace(/×|x|X/g,'*').replace(/÷|:/g,'/').replace(/,/g,'.');
  if (!/^[0-9+\-*/().]+$/.test(e) || !/[+\-*/]/.test(e.slice(1))) return null;
  try { const r = Function('"use strict";return (' + e + ')')(); return (typeof r === 'number' && isFinite(r)) ? r : null; }
  catch (err) { return null; }
}
function parseNum(s){
  const r = evalExpr(s); if (r !== null) return r;
  let t = String(s).replace(/\s|\u00a0|\u202f|€|%/g,'');
  if (t.includes(',')) t = t.replace(/\./g,'').replace(',', '.');
  else if ((t.match(/\./g)||[]).length > 1) t = t.replace(/\./g,'');
  if (!/^-?\d*\.?\d+$/.test(t)) return NaN;
  return parseFloat(t);
}
const NF2 = new Intl.NumberFormat('fr-BE',{minimumFractionDigits:2,maximumFractionDigits:2});
function eur(n){ return NF2.format(n) + ' €'; }
function num(n,max){ return new Intl.NumberFormat('fr-BE',{maximumFractionDigits:max==null?4:max}).format(n); }
function close2(a,b){ return Math.abs(a-b) <= 0.02 + 1e-9; }
function shuffled(n, seed){
  const a = [...Array(n).keys()]; let s = seed;
  for (let i = n-1; i > 0; i--) { s = (s*9301 + 49297) % 233280; const j = Math.floor(s/233280*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function prettyExpr(s){ return String(s).replace(/\*|x|X/g,' × ').replace(/\/|:/g,' ÷ ').replace(/\+/g,' + ').replace(/(\d)-/g,'$1 − ').replace(/\s+/g,' ').trim(); }
function studentName(){
  if (!APP.email) return 'Élève';
  return APP.email.split('@')[0].split(/[._-]/).filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}
function today(){ return new Date().toLocaleDateString('fr-BE',{day:'numeric',month:'long',year:'numeric'}); }

/* =========================================================
   SCHÉMAS SVG (dessinés dans le fichier, sans chiffres de réponse)
   ========================================================= */
function svgGrid(n){
  let r = '';
  for (let k = 0; k < 100; k++){
    const x = (k%10)*22, y = Math.floor(k/10)*22;
    r += `<rect x="${x+1}" y="${y+1}" width="20" height="20" rx="4" fill="${k<n?'#22d68a':'#262c3c'}" stroke="${k<n?'#119a5f':'#3d4558'}"/>`;
  }
  return `<svg viewBox="0 0 222 222" width="170" height="170" role="img" aria-label="Une grille de 100 cases dont ${n} sont colorées">${r}</svg>`;
}
function svgBar(left,right,bottom){
  return `<svg viewBox="0 0 360 108" width="100%" style="max-width:420px" role="img" aria-label="${left} plus ${right} égale ${bottom}">
    <rect x="4" y="12" width="250" height="44" rx="8" fill="rgba(34,214,138,.18)" stroke="#22d68a" stroke-width="2"/>

}
function svgDecision(){
  const t = (x,y,txt,o) => `<text x="${x}" y="${y}" text-anchor="middle" fill="${(o&&o.c)||'#a7aec0'}" font-size="${(o&&o.s)||14}" font-weight="${(o&&o.w)||400}" font-family="Outfit,sans-serif">${txt}</text>`;
  return `<svg viewBox="0 0 360 232" width="100%" style="max-width:420px" role="img" aria-label="Schéma : le client récupère-t-il cet argent ? Non : il fait partie du prix, on l'ajoute avant la TVA. Oui : c'est une consigne, on l'ajoute après la TVA, sans TVA.">

    ${t(180,31,'Le client récupère cet argent ?',{c:'#eef1f7',s:15,w:700})}
    <path d="M130 46 L90 86" stroke="#a7aec0" stroke-width="2" fill="none"/>
    <path d="M230 46 L270 86" stroke="#a7aec0" stroke-width="2" fill="none"/>
    ${t(92,70,'Non',{s:14,w:700})}${t(268,70,'Oui',{s:14,w:700})}
    <rect x="4" y="88" width="170" height="138" rx="10" fill="rgba(34,214,138,.12)" stroke="#22d68a" stroke-width="2"/>
    ${t(89,118,'Il fait partie',{c:'#eef1f7',s:15,w:700})}${t(89,138,'du prix',{c:'#eef1f7',s:15,w:700})}
    ${t(89,166,"On l'ajoute")}${t(89,186,'AVANT la TVA',{c:'#22d68a',w:700})}${t(89,208,'(il est taxé)')}
    <rect x="186" y="88" width="170" height="138" rx="10" fill="rgba(255,138,61,.12)" stroke="#ff8a3d" stroke-width="2"/>
    ${t(271,118,"C'est une",{c:'#eef1f7',s:15,w:700})}${t(271,138,'consigne',{c:'#eef1f7',s:15,w:700})}
    ${t(271,166,"On l'ajoute")}${t(271,186,'APRÈS la TVA',{c:'#ff8a3d',w:700})}${t(271,208,'(sans TVA)')}
  </svg>`;
}
function svgReceipt(){
  return `<svg class="receipt" viewBox="0 0 200 270" role="img" aria-label="Une facture">
    <path d="M10 8 h180 v242 l-15 12 l-15 -12 l-15 12 l-15 -12 l-15 12 l-15 -12 l-15 12 l-15 -12 l-15 12 l-15 -12 l-15 12 l-15 -12 z" fill="#fbf8f0"/>
    <text x="100" y="40" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="800" font-size="20" fill="#1f2633" letter-spacing="2">FACTURE</text>

    <rect x="28" y="90" width="64" height="7" rx="3"/><rect x="132" y="90" width="40" height="7" rx="3"/>
    <rect x="28" y="108" width="92" height="7" rx="3"/><rect x="132" y="108" width="40" height="7" rx="3"/></g>

    <text x="28" y="170" font-family="Outfit,sans-serif" font-size="12" fill="#5b6475">+ frais</text>
    <text x="28" y="190" font-family="Outfit,sans-serif" font-size="12" fill="#5b6475">+ TVA</text>
    <rect x="28" y="202" width="144" height="2" fill="#1f2633"/>
    <text x="28" y="224" font-family="Outfit,sans-serif" font-weight="800" font-size="14" fill="#1f2633">À payer</text>
    <rect x="122" y="212" width="50" height="16" rx="4" fill="#22d68a"/>
    <text x="147" y="224" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="800" font-size="12" fill="#08170f">? €</text>
  </svg>`;
}

/* =========================================================
   CRITÈRES ET INDICATEURS (§4.11)
   ========================================================= */
const CRITERES = [
  { id:'C1', nom:"Calculer avec les pourcentages et la TVA", indicateurs:[
    { id:'I1', texte:"Je calcule un pourcentage d'un montant",
      chapitre:"La TVA (Taxe sur la Valeur Ajoutée) — Formules de calcul de la TVA",
      revoir:"la formule 1 (montant × taux ÷ 100) et ses 3 étapes : multiplier par le taux, puis diviser par 100." },
    { id:'I2', texte:"Je choisis le bon taux et je calcule la TVA et le prix TVAC",
      chapitre:"La TVA (Taxe sur la Valeur Ajoutée) — Les différents taux de TVA en Belgique",
      revoir:"le tableau des taux (6 %, 12 %, 21 %), puis les formules 1 et 2 dans « Formules de calcul de la TVA »." },
    { id:'I3', texte:"Je retrouve le prix HTVA et le taux de TVA à partir d'un prix TVAC",
      chapitre:"La TVA (Taxe sur la Valeur Ajoutée) — Formules de calcul de la TVA",
      revoir:"les formules 3 et 4 : on divise par (100 + taux), on ne retire jamais le taux du prix TVAC." }
  ]},
  { id:'C2', nom:"Calculer une facture dans le bon ordre", indicateurs:[
    { id:'I4', texte:"Je reconnais les réductions et je les déduis avant la TVA",
      chapitre:"Éléments à ajouter et/ou à retrancher — Éléments à retrancher (réductions)",
      revoir:"la raison de chaque réduction (rabais, remise, ristourne, escompte) et le fait qu'elle se retire avant la TVA." },
    { id:'I5', texte:"Je place les frais de port et les emballages avant ou après la TVA",
      chapitre:"Éléments à ajouter et/ou à retrancher — Éléments à ajouter",
      revoir:"la différence entre emballage repris et non repris, et la règle du taux le plus bas." },
    { id:'I6', texte:"Je calcule une facture du prix brut au total à payer",
      chapitre:"Éléments à ajouter et/ou à retrancher — Marche à suivre pour calculer une facture",
      revoir:"le tableau des étapes, du prix brut jusqu'au total à payer." }
  ]}
];

/* =========================================================
   CONTENU PÉDAGOGIQUE (LEVELS)
   ========================================================= */
const LEVELS = [
/* ---------------- MISSION 1 ---------------- */
{ icon:'🔢', title:"Mission 1 — Les pourcentages, pas à pas", short:"Les pourcentages, pas à pas",
  desc:"Comprendre un pourcentage et le calculer en 3 étapes",
  brief:{
    goals:["comprendre ce que veut dire un pourcentage, grâce à une image simple","calculer un pourcentage d'un montant en 3 étapes"],
    theory:`<p>Le signe <b>%</b> veut dire <b>« sur 100 »</b>. Par exemple, <b>15 %</b>, c'est <b>15 sur 100</b> : sur chaque tranche de 100 €, on en prend 15.</p>
      <div class="fig">${svgGrid(15)}<div class="cap">100 cases = le montant entier.<br>15 cases colorées sur 100 = <b>15 %</b>.</div></div>
      <p><b>Méthode en 3 étapes</b> pour calculer un pourcentage d'un montant :</p>
      <ol class="steps"><li>Je repère le <b>montant</b> de départ et le <b>taux</b> (le nombre devant le %).</li><li>Je <b>multiplie</b> le montant par le taux.</li><li>Je <b>divise</b> le résultat par 100.</li></ol>
      <p><b>Raccourcis utiles</b> pour vérifier :</p>
      <div class="tips"><span class="tip-chip"><b>50 %</b> = la moitié</span><span class="tip-chip"><b>10 %</b> = je divise par 10</span><span class="tip-chip"><b>1 %</b> = je divise par 100</span></div>`,
    example:`<h3>🧮 Exemple : calculer 15 % de 60 €</h3>
      <div class="calcline">① Montant : 60 € · taux : 15</div>
      <div class="calcline">② 60 × 15 = 900</div>
      <div class="calcline">③ 900 ÷ 100 = <b>9 €</b></div>
      <p style="margin-top:6px">Vérification : 10 % de 60 €, c'est 60 ÷ 10 = 6 €. 15 %, c'est un peu plus : 9 €, c'est logique.</p>`,
    plus:`Le signe % vient d'une ancienne abréviation italienne de <i>per cento</i>, « pour cent », que les marchands écrivaient à la main dans leurs registres. À force d'être recopiée vite, l'abréviation a fini par devenir le petit signe que l'on connaît.`
  },
  questions:[
    { type:'match', ind:'I1', pts:10,
      text:"Relie chaque calcul à son résultat.",
      data:"Montant de départ : <b>80 €</b>",
      pairs:[["100 % de 80 €","80 €"],["50 % de 80 €","40 €"],["25 % de 80 €","20 €"],["10 % de 80 €","8 €"],["1 % de 80 €","0,80 €"]],
      distractors:["160 €","0,08 €"],
      hint:"Pars de 100 % : c'est le montant entier. Quel pourcentage correspond à la moitié ? Et pour 10 %, en combien de parts égales coupes-tu le montant ?",

/* =========================================================
   CONSTANTES DÉRIVÉES (jamais écrites à la main)
   ========================================================= */
const TYPE_LABEL = {qcm:'QCM',vf:'Vrai / Faux',multi:'Sélection multiple',calc:'Réponse à écrire',zones:'Classement',match:'Appariement',order:'Remise en ordre',invoice:'Facture à compléter'};
const DUR = {qcm:40,vf:20,multi:60,calc:90,zones:90,match:60,order:60,invoice:210};
const BRIEF_SEC = 60;
const DECALAGE = [2,0,3,1, 1,3,0,2, 3,1,2,0, 0,2,1,3, 2,3,0,1];
(function melangerPropositions(liste){
  let k = 0;
  liste.forEach(q => {
    if (q.type !== 'qcm') return;
    const t = DECALAGE[k++ % DECALAGE.length];
    for (let n = 0; n < t; n++){ q.options.unshift(q.options.pop()); q.correct = (q.correct + 1) % q.options.length; }
  });
})(LEVELS.flatMap(lv => lv.questions));
LEVELS.forEach(lv => { lv.maxPoints = lv.questions.reduce((s,q) => s + q.pts, 0); });
const TOTAL_XP = LEVELS.reduce((s,lv) => s + lv.maxPoints, 0);
const TOTAL_Q  = LEVELS.reduce((s,lv) => s + lv.questions.length, 0);
const EST_SEC  = LEVELS.reduce((s,lv) => s + BRIEF_SEC + lv.questions.reduce((t,q) => t + DUR[q.type], 0), 0);
const EST_MIN  = Math.round(EST_SEC / 60);

const RANKS = [
  {p:0,   icon:'🎒', name:'Stagiaire'},
  {p:.20, icon:'🧾', name:'Aide-facturier'},
  {p:.45, icon:'🧮', name:'Facturier'},
  {p:.65, icon:'📊', name:'Comptable'},
  {p:.85, icon:'👑', name:'Chef de la facturation'}
].map(r => Object.assign(r,{xp:Math.ceil(r.p*TOTAL_XP)}));

const BADGES = [
  {id:'m1',      icon:'🚀', name:'Premier pas',      cond:"Terminer la mission 1"},
  {id:'streak5', icon:'🔥', name:'En feu',           cond:"5 bonnes réponses d'affilée"},
  {id:'streak10',icon:'⚡', name:'Inarrêtable',      cond:"10 bonnes réponses d'affilée"},
  {id:'perfect', icon:'💯', name:'Sans faute',       cond:"Toute une mission réussie du premier coup"},
  {id:'tva',     icon:'🧾', name:'Expert TVA',       cond:"80 % des XP ou plus aux missions 2 et 3"},
  {id:'pred',    icon:'🎯', name:'Bien estimé',      cond:"Une prédiction de score juste"},

  {id:'end',     icon:'🏁', name:'Facture bouclée',  cond:"Terminer les 5 missions"}
];
const PRED = { half:{v:.5,label:"Environ la moitié 😅"}, three:{v:.75,label:"Les trois quarts 💪"}, all:{v:1,label:"Toutes ! 🏆"} };

/* =========================================================
   ÉTAT UNIQUE
   ========================================================= */
const APP = {
  screen:'welcome', level:null, q:0, qs:{},
  score:0, streak:0, bestStreak:0, done:{}, pred:{}, badges:new Set(), rankIdx:0,
  sound:false, timerLevel:null, shake:false,
  lastClick:{x:window.innerWidth/2, y:window.innerHeight/2},
  // tracking
  email: lsGet('student_email') || '', classe: lsGet('student_classe') || '',
  exerciseStartTime:null, exerciseTimes:{}, exerciseScores:{}, scoreBeforeExercise:0,
  globalTimerStart:null, globalTimerInterval:null, completedExercises:[]
};
function getQ(lv,q){ const raw = LEVELS[lv].questions[q]; if (raw.variants) return Object.assign({}, raw, raw.variants[APP.scenario]); return raw; }
function st(l,i){
  const k = l + '_' + i;
  if (!APP.qs[k]) APP.qs[k] = {tries:0,status:null,earned:0,fb:null,wrong:[],sel:[],value:'',placed:{},lock:{},checks:0,selected:null,slots:[],vals:{},returned:[],choice:null};
  return APP.qs[k];
}
function isLocked(l){ return l > 0 && !APP.done[l-1]; }

/* =========================================================
   MACHINE À ÉTATS
   ========================================================= */
function setScreen(name){ APP.screen = name; renderScreen(); renderNav(); window.scrollTo({top:0,behavior:'smooth'}); }
function renderScreen(){
  const m = document.getElementById('main');
  switch (APP.screen){
    case 'welcome':  m.innerHTML = renderWelcome(); break;
    case 'hub':      m.innerHTML = renderHub(); break;
    case 'brief':    m.innerHTML = renderBrief(APP.level); break;
    case 'question': m.innerHTML = renderQuestion(APP.level, APP.q); break;
    case 'bilan':    m.innerHTML = renderBilan(APP.level); break;
  }
  if (APP.screen === 'question'){
    st(APP.level, APP.q).returned = [];
    if (APP.shake){ const c = document.getElementById('qcard'); if (c){ c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); } }
  }
  APP.shake = false;
  updateHUD();
}
function renderNav(){
  const box = document.getElementById('navDots');
  box.innerHTML = LEVELS.map((lv,l) => {
    const locked = isLocked(l), done = !!APP.done[l], cur = (APP.screen==='brief'||APP.screen==='question'||APP.screen==='bilan') && APP.level===l;
    const cls = 'navdot' + (locked?' locked':'') + (done?' done':'') + (cur?' current':'');
    return `<button class="${cls}" ${locked?'disabled aria-disabled="true"':''} onclick="openLevel(${l})" aria-label="Mission ${l+1}${done?' terminée':locked?' verrouillée':''}">${done?'✓':locked?'🔒':l+1}</button>`;
  }).join('');
}
function updateHUD(){
  document.getElementById('hudXP').textContent = fmtXP(APP.score) + ' XP';
  const sk = document.getElementById('hudStreak');
  sk.textContent = '🔥 ' + APP.streak; sk.classList.toggle('hot', APP.streak >= 3);
  const pct = Math.min(100, APP.score / TOTAL_XP * 100);
  document.getElementById('xpFill').style.width = pct + '%';
  let idx = 0; RANKS.forEach((r,k) => { if (APP.score >= r.xp) idx = k; });
  const r = RANKS[idx], nx = RANKS[idx+1];
  document.getElementById('rankLabel').innerHTML = `${r.icon} <b>${r.name}</b>`;
  document.getElementById('nextLabel').textContent = nx ? `prochain rang à ${nx.xp} XP` : 'rang maximum atteint 👑';
  document.getElementById('xpMarks').innerHTML = RANKS.slice(1).map((x,k) =>
    `<span class="xpmark${nx && x.xp===nx.xp?' next':''}" style="left:${x.p*100}%" title="${x.icon} ${x.name} : ${x.xp} XP"></span>`).join('');
  if (idx > APP.rankIdx){ APP.rankIdx = idx; showRankUp(r); }
}
function fmtXP(n){ return Number.isInteger(n) ? String(n) : num(n,1); }

/* =========================================================
   ÉCRAN D'ACCUEIL
   ========================================================= */
function renderWelcome(){
  return `<section class="welcome">

    <div>
      <h1>La Facture</h1>

      <div class="stats">
        <div class="stat"><b>${LEVELS.length}</b><span>missions</span></div>

/* =========================================================
   PARCOURS (HUB)
   ========================================================= */
function renderHub(){
  let h = '';
  if (LEVELS.every((_,l) => APP.done[l])) h += renderFinal();
  h += `<h2 class="section-title">🗺️ Ton parcours</h2><div class="path">`;
  LEVELS.forEach((lv,l) => {
    const locked = isLocked(l), d = APP.done[l];
    const nodeCls = d ? 'done' : locked ? 'locked' : 'todo';
    const meta = d ? `<span class="stars">${starStr(d.ratio)}</span> &nbsp;${fmtXP(d.pts)} / ${lv.maxPoints} XP`
                   : `${lv.questions.length} questions · ${lv.maxPoints} XP à gagner`;
    h += `<div class="prow ${l%2?'right':'left'}">
      <button class="node ${nodeCls}" onclick="openLevel(${l})" ${locked?'disabled aria-disabled="true"':''} aria-label="Mission ${l+1}">${d?'✓':locked?'🔒':l+1}</button>
      <button class="pcard${locked?' locked':''}" onclick="openLevel(${l})" ${locked?'disabled aria-disabled="true"':''}>
        <span class="ic">${lv.icon}</span><h3>${lv.short}</h3><p>${lv.desc}</p><div class="meta">${meta}</div>
      </button></div>`;
  });
  h += `</div><h2 class="section-title">🏆 Vitrine à trophées <span class="muted small">(${APP.badges.size} / ${BADGES.length})</span></h2>
    <div class="trophies">${BADGES.map(b => `<div class="trophy ${APP.badges.has(b.id)?'on':'off'}"><div class="ti">${b.icon}</div><b>${b.name}</b><span>${b.cond}</span></div>`).join('')}</div>`;
  return h;
}
function starStr(r){ const n = r>=.85?3:r>=.65?2:r>=.45?1:0; return '★'.repeat(n) + '☆'.repeat(3-n); }

function openLevel(l){
  if (l == null || isLocked(l)) return;
  APP.level = l;
  if (APP.done[l]) { setScreen('bilan'); return; }
  if (APP.timerLevel !== l && !APP.completedExercises.includes(l)) { startExerciseTimer(l); APP.timerLevel = l; }
  setScreen('brief');
}
function goHub(){ setScreen('hub'); }

/* =========================================================
   BRIEFING
   ========================================================= */
function renderBrief(l){
  const lv = LEVELS[l], b = lv.brief, started = lv.questions.some((_,i) => APP.qs[l+'_'+i]);
  const p = APP.pred[l];
  return `<section class="brief">
    <div class="brief-head"><div class="big">${lv.icon}</div><div>
      <p class="muted small">Mission ${l+1} sur ${LEVELS.length}</p><h2>${lv.short}</h2>
      <div class="chips"><span class="chip-info">${lv.questions.length} questions</span><span class="chip-info">${lv.maxPoints} XP en jeu</span></div></div></div>
    <div class="card goals"><h3>🎯 À la fin de cette mission, tu sauras…</h3><ul>${b.goals.map(g => `<li>${g}</li>`).join('')}</ul></div>
    <div class="card theory">${b.theory}</div>
    <div class="example">${b.example}</div>
    <div class="plus"><h3>✨ Pour aller plus loin</h3>${b.plus}<p class="small muted" style="margin-top:6px">Ce bonus n'est pas évalué.</p></div>
    <div class="card predict"><h3>🔮 Combien de questions penses-tu réussir du premier coup ?</h3>
      <div class="opts">${Object.keys(PRED).map(k => `<button class="pred-btn${p===k?' on':''}" data-pred="${k}" onclick="setPred(${l},'${k}')" ${started&&p?'disabled':''}>${PRED[k].label}</button>`).join('')}</div></div>
    <div class="row between">
      <button class="btn ghost" onclick="goHub()">← Parcours</button>
      <button class="btn" id="startBtn" onclick="startLevel(${l})" ${p?'':'disabled'}>${started?'Reprendre ➜':"C'est parti ➜"}</button>
    </div>
  </section>`;
}
function setPred(l,k){ APP.pred[l] = k; renderScreen(); }
function startLevel(l){
  if (!APP.pred[l]) return;
  const qs = LEVELS[l].questions; let i = 0;
  while (i < qs.length - 1 && st(l,i).status) i++;
  APP.level = l; APP.q = i; setScreen('question');
}

/* =========================================================
   QUESTION
   ========================================================= */
function renderQuestion(l,i){
  const Q = getQ(l,i), s = st(l,i), lv = LEVELS[l];
  const dots = lv.questions.map((_,k) => { const x = APP.qs[l+'_'+k]; const c = k===i && !(x&&x.status) ? 'cur' : (x && x.status) || ''; return `<span class="qdot ${c}" title="Question ${k+1}"></span>`; }).join('');
  let body = '';
  switch (Q.type){
    case 'qcm': body = bodyQCM(l,i,Q,s); break;
    case 'vf': body = bodyVF(l,i,Q,s); break;
    case 'multi': body = bodyMulti(l,i,Q,s); break;
    case 'calc': body = bodyCalc(l,i,Q,s); break;
    case 'zones': body = bodyZones(l,i,Q,s); break;
    case 'match': body = bodyMatch(l,i,Q,s); break;
    case 'order': body = bodyOrder(l,i,Q,s); break;
    case 'invoice': body = bodyInvoice(l,i,Q,s,false); break;
  }
  const last = i === lv.questions.length - 1;
  let act = '';
  if (s.status) act = `<button class="btn" id="nextBtn" onclick="nextQ(${l},${i})">${last?'Voir le bilan ➜':'Question suivante ➜'}</button>`;
  else if (['multi','calc','zones','match','order','invoice'].includes(Q.type)) act = `<button class="btn" id="checkBtn" onclick="checkQ(${l},${i})">Vérifier</button>`;
  return `<section class="qwrap">
    <div class="qtop"><span class="where">${lv.icon} Mission ${l+1} · Question ${i+1} sur ${lv.questions.length}</span><div class="qdots">${dots}</div></div>
    <article class="card" id="qcard">
      <div class="qmeta">${TYPE_LABEL[Q.type]} — ${Q.type==='vf'?'1 essai':'2 essais'} · ${Q.pts} XP</div>
      <h2 class="qtext">${Q.text}</h2>
      ${Q.data ? `<span class="data">${Q.data}</span>` : ''}
      ${body}
      <div aria-live="polite">${renderFb(Q,s)}</div>
      <div class="qactions"><button class="btn ghost" onclick="goHub()">🗺️ Parcours</button>${act}</div>
    </article>
  </section>`;
}
function stepsHTML(Q){ return Q.steps ? Q.steps.map(x => `<span class="stepline">${x}</span>`).join('') : ''; }
function renderFb(Q,s){
  const f = s.fb; if (!f) return '';
  const heads = {
    ok:'✅ C\'est juste.',
    h2:'🔄 Juste au 2e essai.',
    hint:'💡 Indice',
    shown: f.answer != null ? `👁 La bonne réponse : ${f.answer}` : '👁 Les corrections sont affichées en rouge.',
    info:'ℹ️'
  };
  const full = (f.kind==='ok'||f.kind==='h2'||f.kind==='shown');
  return `<div class="fb ${f.kind}"><div class="fbh">${heads[f.kind]}</div>${full?stepsHTML(Q):''}<div>${f.html}</div></div>`;
}
function nextQ(l,i){
  if (i + 1 < LEVELS[l].questions.length){ APP.q = i + 1; setScreen('question'); }
  else finishLevel(l);
}
function checkQ(l,i){
  const t = getQ(l,i).type;
  if (t==='multi') checkMulti(l,i); else if (t==='calc') checkCalc(l,i); else if (t==='zones') checkZones(l,i);
  else if (t==='match') checkMatch(l,i); else if (t==='order') checkOrder(l,i); else if (t==='invoice') checkInvoice(l,i);
}

/* ---------- Score et retours ---------- */
function addPts(l,i,n){ if (!n) return; st(l,i).earned += n; APP.score += n; floatXP(n); }
function onGood(){
  APP.streak++; APP.bestStreak = Math.max(APP.bestStreak, APP.streak);
  burst(); playGood();
  if (APP.streak >= 3) comboFlash(APP.streak);
  const sk = document.getElementById('hudStreak'); sk.classList.remove('pulse'); void sk.offsetWidth; sk.classList.add('pulse');
}
function onBad(){ APP.streak = 0; APP.shake = true; playBad(); }
function finishQ(l,i,status){ st(l,i).status = status; checkBadges(); }

/* ---------- QCM ---------- */
function bodyQCM(l,i,Q,s){
  return `<div class="opts-list">${Q.options.map((o,k) => {
    let c = 'opt';
    if (s.wrong.includes(k)) c += ' bad';
    if (s.status && k === Q.correct) c += ' good';
    const dis = s.status || s.wrong.includes(k);
    return `<button class="${c}" data-opt="${k}" onclick="answerQCM(${l},${i},${k})" ${dis?'disabled':''}>${o}</button>`;
  }).join('')}</div>`;
}
function answerQCM(l,i,k){
  const Q = getQ(l,i), s = st(l,i);
  if (s.status || s.wrong.includes(k)) return;
  if (k === Q.correct){
    addPts(l,i, s.tries===0 ? Q.pts : Q.pts/2); onGood();
    s.fb = {kind: s.tries===0?'ok':'h2', html:Q.explain}; finishQ(l,i, s.tries===0?'correct':'hint');
  } else {
    s.wrong.push(k); s.tries++; onBad();
    if (s.tries === 1) s.fb = {kind:'hint', html:Q.hint};
    else { s.fb = {kind:'shown', html:Q.explain, answer:Q.options[Q.correct]}; finishQ(l,i,'shown'); }
  }
  renderScreen();
}

/* ---------- Vrai / Faux ---------- */
function bodyVF(l,i,Q,s){
  const b = (v,label) => {
    let c = 'opt';
    if (s.status){ if (v === Q.answer) c += ' good'; else if (s.choice === v) c += ' bad'; }
    return `<button class="${c}" data-vf="${v}" onclick="answerVF(${l},${i},${v})" ${s.status?'disabled':''}>${label}</button>`;
  };
  return `<div class="vf">${b(true,'👍 Vrai')}${b(false,'👎 Faux')}</div>`;
}
function answerVF(l,i,v){
  const Q = getQ(l,i), s = st(l,i);
  if (s.status) return;
  s.choice = v;
  if (v === Q.answer){ addPts(l,i,Q.pts); onGood(); s.fb = {kind:'ok', html:Q.explain}; finishQ(l,i,'correct'); }
  else { onBad(); s.fb = {kind:'shown', html:Q.explain, answer:Q.answer?'Vrai':'Faux'}; finishQ(l,i,'shown'); }
  renderScreen();
}

/* ---------- Sélection multiple ---------- */
function bodyMulti(l,i,Q,s){
  const order = shuffled(Q.options.length, l*31 + i*7 + 11);
  return `<div class="opts-list">${order.map(k => {
    const o = Q.options[k], on = !!s.sel[k];
    let c = 'opt' + (on ? ' sel' : '');
    if (s.status === 'shown'){ c = 'opt' + (o.ok && on ? ' good' : o.ok ? ' missed' : on ? ' bad' : ''); }
    else if (s.status){ c = 'opt' + (o.ok ? ' good' : ''); }
    return `<button class="${c}" data-m="${k}" onclick="toggleMulti(${l},${i},${k})" ${s.status?'disabled':''} aria-pressed="${on}"><span class="box">${on?'✓':''}</span>${o.t}</button>`;
  }).join('')}</div>${s.status==='shown'?'<p class="helper" style="margin-top:8px">En pointillés : les bonnes réponses que tu n\'avais pas cochées.</p>':''}`;
}
function toggleMulti(l,i,k){ const s = st(l,i); if (s.status) return; s.sel[k] = !s.sel[k]; renderScreen(); }
function checkMulti(l,i){
  const Q = getQ(l,i), s = st(l,i);
  if (s.status) return;
  if (!Q.options.some((_,k) => s.sel[k])){ s.fb = {kind:'info', html:"Coche au moins une proposition avant de vérifier."}; renderScreen(); return; }
  const right = Q.options.every((o,k) => !!s.sel[k] === o.ok);
  if (right){ addPts(l,i, s.tries===0?Q.pts:Q.pts/2); onGood(); s.fb = {kind:s.tries===0?'ok':'h2', html:Q.explain}; finishQ(l,i, s.tries===0?'correct':'hint'); }
  else {
    s.tries++; onBad();
    if (s.tries === 1) s.fb = {kind:'hint', html:Q.hint};
    else { s.fb = {kind:'shown', html:Q.explain, answer:Q.options.filter(o=>o.ok).map(o=>o.t).join(' ; ')}; finishQ(l,i,'shown'); }
  }
  renderScreen();
}

/* ---------- Réponse à écrire ---------- */
function bodyCalc(l,i,Q,s){
  return `<div class="calc">
    <div class="inrow"><input id="calcIn" type="text" autocomplete="off" aria-label="Ta réponse" placeholder="Ta réponse ou ton calcul" value="${esc(s.value)}"
      oninput="calcInput(${l},${i},this.value)" onkeydown="if(event.key==='Enter')checkCalc(${l},${i})" ${s.status?'disabled':''}><span class="unit">${Q.unit}</span></div>
    <div class="preview" id="calcPrev">${previewText(s.value)}</div>
    <p class="helper">Tu peux taper un nombre ou tout ton calcul (avec ×, ÷, :, * ou /) : le résultat s'affiche juste en dessous.</p>
  </div>`;
}
function previewText(v){
  if (!v) return '';
  const r = evalExpr(v);
  return r === null ? '' : `${esc(prettyExpr(v))} → = ${num(r)}`;
}
function calcInput(l,i,v){ st(l,i).value = v; const p = document.getElementById('calcPrev'); if (p) p.textContent = previewText(v).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>'); }
function checkCalc(l,i){
  const Q = getQ(l,i), s = st(l,i);
  if (s.status) return;
  const v = parseNum(s.value);
  if (!String(s.value).trim() || isNaN(v)){ s.fb = {kind:'info', html:"Écris un nombre (ou un calcul) avant de vérifier."}; renderScreen(); return; }
  if (close2(v, Q.answer)){
    addPts(l,i, s.tries===0?Q.pts:Q.pts/2); onGood();
    s.fb = {kind:s.tries===0?'ok':'h2', html:Q.explain}; finishQ(l,i, s.tries===0?'correct':'hint');
  } else {
    s.tries++; onBad();
    if (s.tries === 1){
      const trap = (Q.traps||[]).find(t => close2(t.v, v));
      s.fb = {kind:'hint', html: trap ? trap.m : Q.hint};
    } else {
      s.fb = {kind:'shown', html:Q.explain, answer: Q.unit==='%' ? num(Q.answer)+' %' : eur(Q.answer)};
      finishQ(l,i,'shown');
    }
  }
  renderScreen();
}

/* ---------- Exercices à éléments : barème commun (§3.8) ---------- */
function itemCheck(l,i,keys,isRight,clearWrong){
  const Q = getQ(l,i), s = st(l,i), v = Q.pts / keys.length;
  s.checks++; let gained = 0; s.returned = [];
  keys.forEach(k => {
    if (s.lock[k]) return;
    if (isRight(k)){ s.lock[k] = s.checks===1 ? 'g' : 'o'; gained += s.checks===1 ? v : v/2; }
    else if (s.checks === 1){ clearWrong(k); s.returned.push(k); }
    else s.lock[k] = 'r';
  });
  addPts(l,i,gained);
  s.selected = null;
  const nOk = keys.filter(k => s.lock[k]==='g' || s.lock[k]==='o').length;
  if (s.checks === 1 && nOk === keys.length){ onGood(); itemFinish(l,i,keys); }
  else if (s.checks === 1){
    onBad();
    const phr = nOk === 0 ? "Aucun élément n'est juste pour l'instant." : nOk === 1 ? "<b>1 élément</b> est juste et reste verrouillé." : `<b>${nOk} éléments sur ${keys.length}</b> sont justes et restent verrouillés.`;
    s.fb = {kind:'hint', html:`${phr} Corrige les autres, puis vérifie une dernière fois.<br>${Q.hint}`};
  } else {
    if (nOk === keys.length) onGood(); else onBad();
    itemFinish(l,i,keys);
  }
  renderScreen();
}
function itemFinish(l,i,keys){
  const s = st(l,i), Q = getQ(l,i), all = keys.map(k => s.lock[k]);
  const status = all.every(x => x==='g') ? 'correct' : all.includes('r') ? 'shown' : 'hint';
  s.fb = {kind: status==='correct'?'ok':status==='hint'?'h2':'shown', html:Q.explain};
  finishQ(l,i,status);
}
function lockCls(s,k){ return s.lock[k] ? ' ' + s.lock[k] : ''; }

/* ---------- Classement par zones ---------- */
function bodyZones(l,i,Q,s){
  const order = shuffled(Q.items.length, l*31 + i*7 + 11);
  const chip = k => {
    const it = Q.items[k], lk = s.lock[k];
    const corr = lk==='r' ? `<span class="corr">→ ${Q.zones.find(z=>z.id===it.z).label}</span>` : '';
    const placed = s.placed[k] != null;
    const cls = 'chip' + lockCls(s,k) + (s.selected===k?' sel':'') + (s.returned.includes(k)?' bounce':'');
    const act = lk || s.status ? '' : placed ? `onclick="zChip(${l},${i},${k},event)"` : `onclick="zSelect(${l},${i},${k})"`;
    return `<button class="${cls}" data-chip="${k}" ${act} ${lk||s.status?'aria-disabled="true"':''}>${it.t}${corr}</button>`;
  };
  const bank = order.filter(k => s.placed[k] == null).map(chip).join('');
  const zones = Q.zones.map(z => `<div class="zone${s.selected!=null?' armed':''}" data-zone="${z.id}" onclick="zDrop(${l},${i},'${z.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')zDrop(${l},${i},'${z.id}')"><div class="zh">${z.label}</div>${order.filter(k => s.placed[k]===z.id).map(chip).join('')}</div>`).join('');
  return `<p class="helper" style="margin-bottom:8px">Clique une étiquette, puis clique la colonne où elle va. Clique une étiquette placée pour la reprendre.</p>
    <div class="bank">${bank}</div><div class="zones" style="--nz:${Q.zones.length}">${zones}</div>`;
}
function zSelect(l,i,k){ const s = st(l,i); if (s.status) return; s.selected = s.selected===k ? null : k; renderScreen(); }
function zDrop(l,i,z){ const s = st(l,i); if (s.status || s.selected==null) return; s.placed[s.selected] = z; s.selected = null; renderScreen(); }
function zChip(l,i,k,ev){
  if (ev) ev.stopPropagation();
  const s = st(l,i); if (s.status || s.lock[k]) return;
  if (s.selected != null && s.selected !== k){ s.placed[s.selected] = s.placed[k]; s.selected = null; }   // étiquette armée : on la dépose dans cette colonne
  else { delete s.placed[k]; s.selected = k; }                                                       // sinon : on reprend l'étiquette
  renderScreen();
}
function checkZones(l,i){
  const Q = getQ(l,i), s = st(l,i);
  if (s.status) return;
  if (Q.items.some((_,k) => s.placed[k] == null)){ s.fb = {kind:'info', html:"Place toutes les étiquettes avant de vérifier."}; renderScreen(); return; }
  itemCheck(l,i, Q.items.map((_,k)=>k), k => s.placed[k]===Q.items[k].z, k => { delete s.placed[k]; });
}

/* ---------- Appariement ---------- */
function bodyMatch(l,i,Q,s){
  const pool = Q.pairs.map(p => p[1]).concat(Q.distractors);
  const order = shuffled(pool.length, l*31 + i*7 + 11).map(k => pool[k]);
  const usedLocked = Q.pairs.map((_,k) => s.lock[k] ? s.sel[k] : null).filter(Boolean);
  return `<p class="helper" style="margin-bottom:10px">Choisis dans chaque liste. Attention : certaines propositions ne servent à rien.</p>` +
    Q.pairs.map((p,k) => {
      const lk = s.lock[k];
      const opts = order.filter(o => !usedLocked.includes(o) || s.sel[k]===o).map(o => `<option value="${esc(o)}" ${s.sel[k]===o?'selected':''}>${o}</option>`).join('');
      return `<div class="match-row${lk?' '+lk:''}"><div class="term">${p[0]}</div>
        <select data-row="${k}" aria-label="${esc(p[0])}" onchange="mSelect(${l},${i},${k},this.value)" ${lk||s.status?'disabled':''}><option value="">— choisis —</option>${opts}</select>
        ${lk==='r'?`<div class="corr">✏️ ${p[1]}</div>`:''}</div>`;
    }).join('');
}
function mSelect(l,i,k,v){ const s = st(l,i); if (s.status || s.lock[k]) return; s.sel[k] = v; renderScreen(); }
function checkMatch(l,i){
  const Q = getQ(l,i), s = st(l,i);
  if (s.status) return;
  if (Q.pairs.some((_,k) => !s.sel[k])){ s.fb = {kind:'info', html:"Fais un choix dans chaque liste avant de vérifier."}; renderScreen(); return; }
  itemCheck(l,i, Q.pairs.map((_,k)=>k), k => s.sel[k]===Q.pairs[k][1], k => { s.sel[k] = ''; });
}

/* ---------- Remise en ordre ---------- */
function bodyOrder(l,i,Q,s){
  const n = Q.steps.length, labels = Q.steps.concat(Q.distractors);
  if (s.slots.length !== n) s.slots = Array(n).fill(null);
  const order = shuffled(labels.length, l*31 + i*7 + 11);
  const bank = order.filter(id => !s.slots.includes(id)).map(id => {
    const cls = 'chip' + (s.selected===id?' sel':'') + (s.returned.some(k => s.lastSlots && s.lastSlots[k]===id)?' bounce':'');
    return `<button class="${cls}" data-chip="${id}" onclick="oSelect(${l},${i},${id})" ${s.status?'disabled':''}>${labels[id]}</button>`;
  }).join('');
  const slots = s.slots.map((id,k) => {
    const lk = s.lock[k];
    const cls = 'slot' + (id!=null?' filled':'') + (lk?' '+lk:'') + (s.selected!=null && !lk?' armed':'');
    const inner = id!=null ? `<span>${labels[id]}${lk==='r'?`<span class="corr">✏️ ${Q.steps[k]}</span>`:''}</span>` : `<span class="ph">Clique une étape, puis cette case</span>`;
    return `<li><button class="${cls}" data-slot="${k}" onclick="oDrop(${l},${i},${k})" ${lk||s.status?'aria-disabled="true"':''}><span class="n">${k+1}</span>${inner}</button></li>`;
  }).join('');
  return `<p class="helper" style="margin-bottom:8px">Clique une étape, puis la case numérotée où elle va. Deux étapes sont des pièges et ne servent à rien.</p>
    <div class="bank">${bank}</div><ol class="slots">${slots}</ol>`;
}
function oSelect(l,i,id){ const s = st(l,i); if (s.status) return; s.selected = s.selected===id ? null : id; renderScreen(); }
function oDrop(l,i,k){
  const s = st(l,i); if (s.status || s.lock[k]) return;
  if (s.selected != null){ s.slots[k] = s.selected; s.selected = null; }
  else if (s.slots[k] != null){ s.slots[k] = null; }
  renderScreen();
}
function checkOrder(l,i){
  const Q = getQ(l,i), s = st(l,i);
  if (s.status) return;
  if (s.slots.length !== Q.steps.length || s.slots.some(x => x == null)){ s.fb = {kind:'info', html:"Remplis toutes les cases avant de vérifier."}; renderScreen(); return; }
  s.lastSlots = s.slots.slice();
  itemCheck(l,i, Q.steps.map((_,k)=>k), k => s.slots[k]===k, k => { s.slots[k] = null; });
}

/* =========================================================
   FIN DE MISSION ET BILANS

function levelStats(l){
  const lv = LEVELS[l]; let c=0,h=0,sh=0,pts=0;
  lv.questions.forEach((_,i) => { const s = st(l,i); pts += s.earned; if (s.status==='correct') c++; else if (s.status==='hint') h++; else sh++; });
  const n = lv.questions.length, firstPct = c/n, ratio = pts/lv.maxPoints;
  const pred = APP.pred[l], predOk = pred ? Math.abs(firstPct - PRED[pred].v) <= 0.15 + 1e-9 : false;
  return {pts, max:lv.maxPoints, c, h, s:sh, n, firstPct, ratio, pred, predOk};
}
function finishLevel(l){
  if (!APP.done[l]){
    APP.done[l] = levelStats(l);
    completeExercise(l);
    checkBadges();
    if (APP.done[l].firstPct >= 0.7) confetti();
    playLevel();
  }
  APP.level = l; setScreen('bilan');
}
function grade(p){ return p>=.85?{g:'A',t:'Excellent'}:p>=.65?{g:'B',t:'Très bien'}:p>=.45?{g:'C',t:'Satisfaisant'}:{g:'D',t:'À retravailler'}; }
function medal(p){ return p>=.9?'🏆':p>=.7?'🥇':p>=.5?'🥈':'🥉'; }
function legendHTML(){ return `<div class="legend"><span><i style="background:var(--success)"></i>✅ du 1er coup</span><span><i style="background:var(--orange)"></i>🔄 au 2e essai</span><span><i style="background:var(--error)"></i>👁 réponse montrée</span></div>`; }
function predNote(d){
  if (!d.pred) return '';
  const lab = PRED[d.pred].label.replace(/ [^ ]+$/,'').toLowerCase();
  let msg;
  if (d.predOk) msg = 'Bonne estimation, tu te connais bien !';
  else if (d.firstPct > PRED[d.pred].v) msg = "Tu t'es sous-estimé·e : tu peux avoir plus confiance en toi.";
  else msg = "Tu étais un peu trop optimiste : relis les corrections pour viser plus juste la prochaine fois.";
  return `<div class="pred-note">🔮 Tu avais prédit <i>${lab}</i> ; tu as réussi <b>${d.c} question${d.c>1?'s':''} sur ${d.n}</b> du premier coup. ${msg}</div>`;
}
function renderBilan(l){
