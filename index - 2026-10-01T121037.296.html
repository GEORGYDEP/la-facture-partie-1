/* ---------- Bilan final par critères (§4.11) ---------- */
function bilanIndicateurs(){
  const acc = {};
  LEVELS.forEach((lv,l) => lv.questions.forEach((q,i) => {
    const a = acc[q.ind] || (acc[q.ind] = {pts:0,max:0});
    a.max += q.pts; a.pts += (APP.qs[l+'_'+i] && APP.qs[l+'_'+i].earned) || 0;
  }));
  const statut = r => r >= 0.8 ? 'atteint' : r >= 0.5 ? 'encours' : 'nonatteint';
  return CRITERES.map(c => {
    const inds = c.indicateurs.map(ind => { const a = acc[ind.id] || {pts:0,max:0}; const r = a.max ? a.pts/a.max : 0; return Object.assign({}, ind, {ratio:r, statut:statut(r)}); });
    const tot = c.indicateurs.reduce((t,ind) => { const a = acc[ind.id] || {pts:0,max:0}; return {pts:t.pts+a.pts, max:t.max+a.max}; }, {pts:0,max:0});
    const r = tot.max ? tot.pts/tot.max : 0;
    return {id:c.id, nom:c.nom, ratio:r, statut:statut(r), indicateurs:inds};
  });
}
const STATUT_LABEL = {atteint:'✅ Atteint', encours:'🟠 En cours d\'acquisition', nonatteint:'❌ Non atteint'};
function renderFinal(){
  let c=0,h=0,s=0,n=0;
  const rows = LEVELS.map((lv,l) => { const d = APP.done[l]; c+=d.c; h+=d.h; s+=d.s; n+=d.n;
    return `<tr><td>${lv.icon} ${lv.short}</td><td>${d.c}</td><td>${d.h}</td><td>${d.s}</td><td class="stars">${starStr(d.ratio)}</td></tr>`; }).join('');
  const fp = c/n, g = grade(fp), r = RANKS[APP.rankIdx];
  const crits = bilanIndicateurs();
  const allOk = crits.every(cr => cr.indicateurs.every(x => x.statut==='atteint'));
  const critHTML = crits.map(cr => `<div class="crit"><div class="crit-h"><span>${cr.id} — ${cr.nom}</span><span class="tag ${cr.statut}">${STATUT_LABEL[cr.statut]}</span></div>
      ${cr.indicateurs.map(x => `<div class="ind"><span>${x.texte}</span><span class="tag ${x.statut}">${STATUT_LABEL[x.statut]}</span>
        ${x.statut!=='atteint'?`<div class="revoir">📖 À revoir dans ton cours : <i>${x.chapitre}</i> — ${x.revoir}</div>`:''}</div>`).join('')}</div>`).join('');
  return `<section class="final-banner bilan" style="max-width:none">
    <div class="card bilan-top">
      <div class="medal">${medal(fp)}</div>
      <h2 style="margin-top:8px">Parcours terminé, ${esc(studentName())} !</h2>
      <p class="muted">${fmtXP(APP.score)} XP sur ${TOTAL_XP} · ${Math.round(fp*100)} % de réussite au 1er essai</p>
      <span class="grade">${g.g} — ${g.t}</span>
      <p class="muted small" style="margin-top:10px">Rang atteint : <b>${r.icon} ${r.name}</b> · Meilleure série : <b>🔥 ${APP.bestStreak}</b> · Badges : <b>${APP.badges.size} / ${BADGES.length}</b></p>
      ${legendHTML()}
      <table class="tbl"><tr><th>Mission</th><th>✅</th><th>🔄</th><th>👁</th><th>Étoiles</th></tr>${rows}
        <tr><td><b>Total</b></td><td><b>${c}</b></td><td><b>${h}</b></td><td><b>${s}</b></td><td></td></tr></table>
    </div>
    <div class="paper fiche" id="bilanFiche">
      <h3>📋 Mon bilan : ce que je maîtrise</h3>
      <p style="color:var(--ink2);font-size:.85rem">${esc(studentName())}${APP.classe?' · '+esc(APP.classe):''} · ${today()}</p>
      ${critHTML}
      ${allOk ? `<p style="margin-top:12px;font-weight:700;color:#0d6b42">🎉 Tous les indicateurs sont atteints : tu maîtrises le calcul d'une facture. Passe aux exercices papier !</p>` : ''}
    </div>
    <div class="row center no-print">
      <button class="btn gold" onclick="window.print()">🖨️ Imprimer mon bilan</button>
      <button class="btn lb-app" onclick="openLB('app')">🏆 Classement</button>
      <button class="btn lb-glob" onclick="openLB('global')">🌍 Général</button>
      <button class="btn orange" onclick="restartGame()">🔁 Rejouer</button>
    </div>
  </section>`;
}

/* =========================================================
   BADGES, RANGS, EFFETS, SONS
   ========================================================= */
function checkBadges(){
  const give = id => { if (!APP.badges.has(id)){ APP.badges.add(id); queueToast(BADGES.find(b => b.id===id)); } };
  if (APP.done[0]) give('m1');
  if (APP.bestStreak >= 5) give('streak5');
  if (APP.bestStreak >= 10) give('streak10');
  Object.keys(APP.done).forEach(l => { if (APP.done[l].firstPct === 1) give('perfect'); if (APP.done[l].predOk) give('pred'); });
  if (APP.done[1] && APP.done[2]){ const r = (APP.done[1].pts + APP.done[2].pts) / (LEVELS[1].maxPoints + LEVELS[2].maxPoints); if (r >= 0.8) give('tva'); }
  const inv = APP.qs['4_3']; if (inv && inv.status === 'correct') give('invoice');
  if (LEVELS.every((_,l) => APP.done[l])) give('end');
}
const TOASTS = []; let toastBusy = false;
function queueToast(b){ TOASTS.push(b); if (!toastBusy) nextToast(); }
function nextToast(){
  const box = document.getElementById('toasts'); const b = TOASTS.shift();
  if (!b){ toastBusy = false; box.innerHTML = ''; return; }
  toastBusy = true; playBadge();
  box.innerHTML = `<div class="toast"><span class="ti">${b.icon}</span><div><small>Badge débloqué</small><b>${b.name}</b><div class="small muted">${b.cond}</div></div></div>`;
  setTimeout(nextToast, 3000);
}
function showRankUp(r){
  document.getElementById('rankIcon').textContent = r.icon;
  document.getElementById('rankTitle').textContent = r.name;
  document.getElementById('rankSub').textContent = `Tu as atteint ${r.xp} XP. Continue comme ça !`;
  document.getElementById('rankOverlay').classList.add('show');
  confetti(); playLevel();
}
function closeRankUp(){ document.getElementById('rankOverlay').classList.remove('show'); }
document.addEventListener('pointerdown', e => { APP.lastClick = {x:e.clientX, y:e.clientY}; }, true);
function burst(){
  const fx = document.getElementById('fx'), {x,y} = APP.lastClick, cols = ['#22d68a','#ffc93c','#ff8a3d','#7dd3fc'];
  for (let k = 0; k < 16; k++){
    const p = document.createElement('span'), a = Math.random()*Math.PI*2, d = 40 + Math.random()*60;
    p.className = 'part'; p.style.left = x+'px'; p.style.top = y+'px'; p.style.background = cols[k%4];
    p.style.setProperty('--dx', Math.cos(a)*d+'px'); p.style.setProperty('--dy', Math.sin(a)*d+'px');
    fx.appendChild(p); setTimeout(() => p.remove(), 850);
  }
}
function floatXP(n){
  const fx = document.getElementById('fx'), e = document.createElement('span');
  e.className = 'floatxp'; e.textContent = '+' + fmtXP(n) + ' XP';
  e.style.left = (APP.lastClick.x - 20) + 'px'; e.style.top = (APP.lastClick.y - 30) + 'px';
  fx.appendChild(e); setTimeout(() => e.remove(), 1150);
}
function comboFlash(n){
  const fx = document.getElementById('fx'), e = document.createElement('div');
  e.className = 'combo'; e.textContent = n >= 10 ? `⚡ INARRÊTABLE ×${n}` : n >= 5 ? `🔥 EN FEU ×${n}` : `🔥 COMBO ×${n}`;
  fx.appendChild(e); setTimeout(() => e.remove(), 1050);
}
function confetti(){
  const fx = document.getElementById('fx'), cols = ['#22d68a','#ffc93c','#ff8a3d','#7dd3fc','#f472b6'];
  for (let k = 0; k < 70; k++){
    const c = document.createElement('span'); c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw'; c.style.background = cols[k%5];
    c.style.animationDuration = (2 + Math.random()*1.8) + 's'; c.style.animationDelay = Math.random()*.4 + 's';
    fx.appendChild(c); setTimeout(() => c.remove(), 4400);
  }
}
let AC = null;
function tone(freq,start,dur,type,vol){
  if (!APP.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + start;
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  } catch(e){}
}
function playGood(){ tone(660,0,.12,'sine'); tone(990,.1,.16,'sine'); }
function playBad(){ tone(220,0,.18,'triangle',.08); }
function playBadge(){ tone(784,0,.12); tone(988,.1,.12); tone(1319,.2,.2); }
function playLevel(){ [523,659,784,1047].forEach((f,k) => tone(f,k*.11,.18,'triangle')); }
function toggleSound(){
  APP.sound = !APP.sound;
  const b = document.getElementById('soundBtn');
  b.textContent = APP.sound ? '🔊' : '🔇'; b.setAttribute('aria-label', APP.sound ? 'Couper le son' : 'Activer le son');
  if (APP.sound) playGood();
}

/* =========================================================
   REJOUER
   ========================================================= */
function resetState(){
  APP.qs = {}; APP.score = 0; APP.streak = 0; APP.bestStreak = 0; APP.done = {}; APP.pred = {};
  APP.badges = new Set(); APP.rankIdx = 0; APP.level = null; APP.q = 0; APP.timerLevel = null;
  APP.completedExercises = []; APP.exerciseTimes = {}; APP.exerciseScores = {}; APP.scoreBeforeExercise = 0; APP.exerciseStartTime = null;
}
function restartGame(){
  TRACKING.sessionId = new Date().toISOString();   // ⚠️ nouvelle session
  resetState();
  APP.globalTimerStart = Date.now();
  setScreen('hub');
}

/* ============================================================
   TRACKING — Configuration
   ============================================================ */
const TRACKING = {
  appName: "La Facture — TVA et calculs",
  totalNiveaux: LEVELS.length,
  sessionId: null,
  scriptUrl: "https://script.google.com/macros/s/AKfycbx9bRMVuHU2mgFLii1KcQXD3LdZahnDH1rf1cWv9RuDvQAt0l3VtLtxzmbH7MtpJWRjfA/exec"
};

/* ============================================================
   TRACKING — Modal Email
   ============================================================ */
function showEmailModal(){
  document.getElementById('emailOverlay').classList.add('show');
  const input = document.getElementById('emailInput');
  const saved = lsGet('student_email');
  if (saved) input.value = saved;
  input.focus();
  document.getElementById('emailError').textContent = '';
}
function validateEmail(){
  const input = document.getElementById('emailInput');
  const btn = document.getElementById('emailBtn');
  const errDiv = document.getElementById('emailError');
  const email = input.value.trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    errDiv.textContent = '⚠️ Entre une adresse email valide.'; input.style.borderColor = 'var(--error)'; return;
  }
  btn.textContent = '⏳ Vérification…'; btn.disabled = true; errDiv.textContent = ''; input.style.borderColor = '';
  const cbName = '_emailCb_' + Date.now();
  const timeout = setTimeout(() => {
    delete window[cbName]; const s = document.getElementById(cbName); if (s) s.remove();
    errDiv.textContent = '⚠️ Connexion impossible. Vérifie ta connexion internet.';
    btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false;
  }, 10000);
  window[cbName] = function(resp){
    clearTimeout(timeout); delete window[cbName];
    const s = document.getElementById(cbName); if (s) s.remove();
    btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false;
    if (resp && resp.found){
      const oldEmail = lsGet('student_email');
      lsSet('student_email', email); lsSet('student_classe', resp.classe || '');
      APP.email = email; APP.classe = resp.classe || '';
      if (oldEmail && oldEmail !== email) resetProgression();
      TRACKING.sessionId = new Date().toISOString();
      document.getElementById('emailOverlay').classList.remove('show');
      startGlobalTimer();
      renderScreen(); renderNav();
    } else {
      errDiv.textContent = "⚠️ Cette adresse email n'est pas enregistrée. Vérifie l'orthographe ou demande à ton professeur de t'ajouter à la liste.";
      input.style.borderColor = 'var(--error)';
    }
  };
  const s = document.createElement('script');
  s.id = cbName;
  s.src = `${TRACKING.scriptUrl}?action=check_email&email=${encodeURIComponent(email)}&callback=${cbName}`;
  s.onerror = () => { clearTimeout(timeout); delete window[cbName]; s.remove(); errDiv.textContent = '⚠️ Erreur de connexion au serveur.'; btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false; };
  document.body.appendChild(s);
}
function resetProgression(){ resetState(); console.log('[TRACKING] Progression réinitialisée (nouvel email)'); }

/* ============================================================
   TRACKING — Chronomètres
   ============================================================ */
function startGlobalTimer(){
  APP.globalTimerStart = Date.now();
  const el = document.getElementById('globalTimer'); if (el) el.style.display = 'inline';
  if (APP.globalTimerInterval) clearInterval(APP.globalTimerInterval);
  APP.globalTimerInterval = setInterval(updateTimerDisplay, 1000);
  updateTimerDisplay();
}
function updateTimerDisplay(){
  const el = document.getElementById('globalTimer');
  if (!el || !APP.globalTimerStart) return;
  const e = Math.floor((Date.now() - APP.globalTimerStart) / 1000);
  el.textContent = '⏱️ ' + String(Math.floor(e/60)).padStart(2,'0') + ':' + String(e%60).padStart(2,'0');
}
function formatTime(sec){ const m = Math.floor(sec/60), s = sec%60; return m > 0 ? `${m}m${String(s).padStart(2,'0')}s` : `${s}s`; }
function startExerciseTimer(exIdx){ APP.exerciseStartTime = Date.now(); APP.scoreBeforeExercise = APP.score || 0; }
function stopExerciseTimer(exIdx){
  if (!APP.exerciseStartTime) return null;
  const tempsSec = Math.round((Date.now() - APP.exerciseStartTime) / 1000);
  APP.exerciseTimes[exIdx] = tempsSec; APP.exerciseStartTime = null;
  const deltaPoints = (APP.score || 0) - APP.scoreBeforeExercise;
  APP.exerciseScores[exIdx] = deltaPoints;
  return {points:deltaPoints, temps:tempsSec};
}
function completeExercise(idx){
  if (APP.completedExercises.includes(idx)) return;   // anti-doublon
  APP.completedExercises.push(idx);
  APP.timerLevel = null;
  const result = stopExerciseTimer(idx);
  if (result) sendResult(LEVELS[idx].title, result.points, LEVELS[idx].maxPoints, result.temps);
}

/* ============================================================
   TRACKING — Envoi des résultats
   ============================================================ */
function sendResult(niveau, points, pointsMax, temps){
  if (!APP.email) return;
  const payload = { email:APP.email, classe:APP.classe, app:TRACKING.appName, niveau:niveau, points:points, pointsMax:pointsMax, temps:temps, totalNiveaux:TRACKING.totalNiveaux, sessionId:TRACKING.sessionId };
  console.log('[TRACKING] Envoi:', payload);
  fetch(TRACKING.scriptUrl, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(payload) })
    .catch(err => console.warn('[TRACKING] Erreur:', err));
}

/* ============================================================
   TRACKING — Modal Classement
   ============================================================ */
let currentLBTab = 'app';
function openLB(tab){ document.getElementById('lbOverlay').classList.add('show'); switchLBTab(tab || 'app'); }
function closeLB(){ document.getElementById('lbOverlay').classList.remove('show'); }
function switchLBTab(tab){
  currentLBTab = tab;
  const bA = document.getElementById('lbTabApp'), bG = document.getElementById('lbTabGlobal');
  const cl = APP.classe ? ` (${esc(APP.classe)})` : '';
  document.getElementById('lbTitle').innerHTML = tab === 'app' ? `🏆 Classement — ${TRACKING.appName}${cl}` : `🌍 Classement général${cl}`;
  if (tab === 'app'){ bA.style.background = 'var(--accent)'; bA.style.color = '#08170f'; bG.style.background = 'transparent'; bG.style.color = 'var(--orange)'; }
  else { bG.style.background = 'var(--orange)'; bG.style.color = '#1f0f03'; bA.style.background = 'transparent'; bA.style.color = 'var(--accent)'; }
  fetchLeaderboard(tab);
}
function fetchLeaderboard(tab){
  const content = document.getElementById('lbContent');
  content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2)">⏳ Chargement…</div>';
  const action = tab === 'app' ? 'leaderboard_app' : 'leaderboard_global';
  const cbName = '_lbCb_' + Date.now();
  const timeout = setTimeout(() => {
    delete window[cbName]; const s = document.getElementById(cbName); if (s) s.remove();
    content.innerHTML = `<div style="text-align:center;padding:40px"><div style="color:var(--error);margin-bottom:12px">⚠️ Connexion impossible</div><button class="btn ghost" onclick="fetchLeaderboard('${tab}')">Réessayer</button></div>`;
  }, 10000);
  window[cbName] = function(resp){
    clearTimeout(timeout); delete window[cbName];
    const s = document.getElementById(cbName); if (s) s.remove();
    const lbData = resp && (resp.leaderboard || resp.data);
    if (!lbData || lbData.length === 0){ content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2)">🏁 Aucun résultat pour le moment</div>'; return; }
    renderLeaderboard(lbData, tab);
  };
  let url = `${TRACKING.scriptUrl}?action=${action}&callback=${cbName}&mode=last`;
  if (tab === 'app') url += `&app=${encodeURIComponent(TRACKING.appName)}`;
  if (APP.classe) url += `&classe=${encodeURIComponent(APP.classe)}`;
  const s = document.createElement('script');
  s.id = cbName; s.src = url;
  s.onerror = () => { clearTimeout(timeout); delete window[cbName]; s.remove(); content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--error)">⚠️ Erreur de connexion</div>'; };
  document.body.appendChild(s);
}
function renderLeaderboard(data, tab){
  const content = document.getElementById('lbContent');
  const myEmail = (APP.email || '').toLowerCase();
  if (tab === 'global' && data.length > 0){
    data = data.slice().sort((a,b) => { const pA = a.pct != null ? a.pct : (a.pourcentage || 0), pB = b.pct != null ? b.pct : (b.pourcentage || 0); if (pB !== pA) return pB - pA; return (a.totalTemps || a.totalTime || 0) - (b.totalTemps || b.totalTime || 0); });
    data.forEach((e,i) => { e.rang = i + 1; });
  }
  const me = data.find(r => r.email === myEmail);
  let html = '';
  if (me){
    const pct = me.pct != null ? me.pct : (me.pourcentage != null ? me.pourcentage : 0);
    const count = tab === 'app' ? (me.niveauxCompletes || me.niveaux || 0) : (me.appsCompletes || me.apps || 0);
    const total = tab === 'app' ? (me.totalNiveaux || 0) : (me.totalPossibleNiveaux || 0);
    const label = tab === 'app' ? 'niveaux' : 'apps';
    const prog = total > 0 ? count + '/' + total + ' ' + label : count + ' ' + label;
    html += `<div style="background:rgba(34,214,138,.08);border:1px solid rgba(34,214,138,.3);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;justify-content:space-around;text-align:center;gap:8px;flex-wrap:wrap">
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--accent)">#${me.rang}</div><div style="font-size:.7rem;color:var(--text2)">RANG</div></div>
      <div><div style="font-size:1.3rem;font-weight:800">${me.totalPoints}</div><div style="font-size:.7rem;color:var(--text2)">POINTS</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:${pct>=80?'var(--accent)':pct>=50?'var(--orange)':'var(--error)'}">${pct}%</div><div style="font-size:.7rem;color:var(--text2)">RÉUSSITE</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--text2)">${prog}</div><div style="font-size:.7rem;color:var(--text2)">PROGRESSION</div></div></div>`;
  }
  const medals = ['🥇','🥈','🥉'];
  html += '<table style="width:100%;border-collapse:collapse;font-size:.85rem"><tr style="border-bottom:1px solid var(--border)"><th style="text-align:left;padding:8px 4px;color:var(--text2);font-size:.72rem">#</th><th style="text-align:left;padding:8px 4px;color:var(--text2);font-size:.72rem">Élève</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:.72rem">Pts</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:.72rem">%</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:.72rem">Progression</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:.72rem">Temps</th></tr>';
  data.forEach(row => {
    const r = row.rang || 0;
    const name = String(row.email||'').split('@')[0].split(/[._-]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    const pct = row.pct != null ? row.pct : (row.pourcentage != null ? row.pourcentage : 0);
    const temps = row.totalTemps || row.totalTime || 0;
    const count = tab === 'app' ? (row.niveauxCompletes || row.niveaux || 0) : (row.appsCompletes || row.apps || 0);
    const total = tab === 'app' ? (row.totalNiveaux || 0) : (row.totalPossibleNiveaux || 0);
    const bar = total > 0 ? `<div style="display:inline-block;width:60px;height:6px;background:var(--bg3);border-radius:3px;vertical-align:middle"><div style="width:${Math.min(100,count/total*100)}%;height:100%;background:var(--accent);border-radius:3px"></div></div> <span style="font-size:.72rem;color:var(--text2)">${count}/${total}</span>` : `${count}`;
    const isMe = row.email === myEmail;
    const pctC = pct>=80?'var(--accent)':pct>=50?'var(--orange)':'var(--error)';
    html += `<tr style="border-bottom:1px solid rgba(255,255,255,.03);background:${isMe?'rgba(34,214,138,.08)':'transparent'}"><td style="padding:8px 4px;font-weight:700">${r<=3&&r>0?medals[r-1]:r}</td><td style="padding:8px 4px;${isMe?'font-weight:800;color:var(--accent)':''}">${esc(name)}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:var(--accent)">${row.totalPoints}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:${pctC}">${pct}%</td><td style="padding:8px 4px;text-align:right">${bar}</td><td style="padding:8px 4px;text-align:right;color:var(--text2);font-family:var(--mono);font-size:.78rem">${temps>0?formatTime(temps):'—'}</td></tr>`;
  });
  html += '</table>';
  content.innerHTML = html;
}

/* =========================================================
   INIT
   ========================================================= */
function init(){
  renderScreen(); renderNav();
  showEmailModal();   // ← TOUJOURS, même si un email est mémorisé
}
init();
